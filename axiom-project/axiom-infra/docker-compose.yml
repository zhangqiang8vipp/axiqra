version: "3.9"

# ============================================================
# Axiqra S1 MVP 全量中间件编排
# 启动命令：cd axiom-infra && docker compose up -d
# 查看日志：cd axiom-infra && docker compose logs -f
# 停止：cd axiom-infra && docker compose down
# ============================================================

services:
  # -------------------- CockroachDB 业务主库 --------------------
  axiqra_cockroachdb_primary:
    image: cockroachdb/cockroach:v24.1.0
    container_name: axiqra_cockroachdb_primary
    hostname: axiqra-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "26258:26258"
    volumes:
      - axiqra_cockroachdb_data:/cockroach/cockroach-data
      - ./docker/cockroachdb/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - axiqra_internal_net
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # -------------------- PostgreSQL 审计库 --------------------
  axiqra_postgres_audit:
    image: postgres:16-alpine
    container_name: axiqra_postgres_audit
    environment:
      POSTGRES_DB: axq_audit_db
      POSTGRES_USER: ${AUDIT_DB_USER}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - axiqra_audit_data:/var/lib/postgresql/data
      - ./docker/postgres-audit/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - axiqra_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER} -d axq_audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # -------------------- Redis 缓存 --------------------
  axiqra_redis_cache:
    image: redis:7-alpine
    container_name: axiqra_redis_cache
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - axiqra_redis_data:/data
    networks:
      - axiqra_internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------- MinIO 对象存储（S1 预留） --------------------
  axiqra_minio_storage:
    image: minio/minio:latest
    container_name: axiqra_minio_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SSE_S3_CONFIG: /data/.sse-config.json
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - axiqra_minio_data:/data
      - ./docker/minio/sse-config.json:/data/.sse-config.json:ro
    networks:
      - axiqra_internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # -------------------- 后端 API 服务 --------------------
  axiqra_core:
    build:
      context: ../axiom-code
      dockerfile: axiom-start/Dockerfile
    container_name: axiqra_core
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FIELD_ENCRYPT_KEY: ${FIELD_ENCRYPT_KEY}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - axiqra_logs:/var/log/axiqra
    depends_on:
      axiqra_cockroachdb_primary:
        condition: service_healthy
      axiqra_postgres_audit:
        condition: service_healthy
      axiqra_redis_cache:
        condition: service_healthy
      axiqra_minio_storage:
        condition: service_healthy
    networks:
      - axiqra_internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # -------------------- 前端 Web 服务 --------------------
  axiqra_frontend:
    build:
      context: ../axiom-frontend
      dockerfile: Dockerfile
    container_name: axiqra_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - axiqra_core
    networks:
      - axiqra_internal_net
    restart: unless-stopped

networks:
  axiqra_internal_net:
    name: axiqra_internal_net
    driver: bridge

volumes:
  axiqra_cockroachdb_data:
    name: axiqra_cockroachdb_data
  axiqra_audit_data:
    name: axiqra_audit_data
  axiqra_redis_data:
    name: axiqra_redis_data
  axiqra_minio_data:
    name: axiqra_minio_data
  axiqra_logs:
    name: axiqra_logs
