name: OpenRouter AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".gitignore"
      - "docs/**"
      - "axiqra-project/**"
      - "tests/**"
      - ".github/workflows/openrouter-review.yml"
      - ".github/workflows/gemini-review.yml"
      - ".github/workflows/axiqra-quality-gates-sample.yml"
      - ".github/scripts/**"
      - "*.mjs"
      - "*.js"
      - "*.py"
      - "*.java"
      - "*.xml"
      - "*.yml"
      - "*.yaml"
      - "*.sql"
      - "Dockerfile*"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number to review"
        required: false
        type: string

jobs:
  openrouter-review:
    name: OpenRouter AI Code Review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR info
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            pr_data=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '{title: .title, body: .body, base: .base.ref, head: .head.ref, author: .user.login}')
            echo "title=$(echo $pr_data | jq -r '.title')" >> $GITHUB_OUTPUT
            echo "base=$(echo $pr_data | jq -r '.base')" >> $GITHUB_OUTPUT
            echo "author=$(echo $pr_data | jq -r '.author')" >> $GITHUB_OUTPUT
          fi

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh pr diff $PR_NUMBER > pr_changes.diff
            echo "diff_size=$(wc -l < pr_changes.diff)" >> $GITHUB_OUTPUT
          fi

      - name: OpenRouter Code Review
        id: review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY secret not set. Skipping OpenRouter review."
            exit 0
          fi

          PR_INFO="PR #$PR_NUMBER - ${{ steps.pr_info.outputs.title }}"
          AUTHOR="${{ steps.pr_info.outputs.author }}"
          BASE="${{ steps.pr_info.outputs.base }}"
          DIFF_SIZE="${{ steps.diff.outputs.diff_size }}"

          # Read diff content (truncated for model context window)
          DIFF_CONTENT=$(head -c 120000 pr_changes.diff 2>/dev/null || cat pr_changes.diff)

          RESPONSE=$(curl -s -X POST \
            "https://openrouter.ai/api/v1/chat/completions" \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://github.com/zhangqiang8vipp/axiqra" \
            -H "X-Title: Axiqra Code Review" \
            -d "{
              \"model\": \"openrouter/free\",
              \"max_tokens\": 2048,
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are an expert code reviewer for the Axiqra project (a knowledge engineering and memory system). Provide concise, actionable feedback.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"Review the following PR changes.\n\nPR: $PR_INFO\nAuthor: $AUTHOR\nBase branch: $BASE\nDiff size: $DIFF_SIZE lines\n\n## Review Focus\n1. Security: hardcoded secrets, API key leaks, injection risks\n2. MCP protocol compliance: quota limits, error handling\n3. Error handling: async try/catch, proper HTTP status codes\n4. Test coverage: new code has corresponding tests\n5. Code quality: ESM imports, naming, error context\n6. Workflow changes: trigger paths, permissions, secrets usage\n\n## Output Format\n## Summary\n[One paragraph overview]\n\n## Critical Issues (must fix)\n- [file:line] - issue description\n\n## Suggestions (recommended)\n- [file:line] - suggestion description\n\n## Positive Highlights\n- What was done well\n\n---\n\`\`\`diff\n$DIFF_CONTENT\n\`\`\`\"
                }
              ]
            }")

          REVIEW=$(echo $RESPONSE | jq -r '.choices[0].message.content // empty')

          if [ -n "$REVIEW" ]; then
            echo "review_body<<EOF" >> $GITHUB_OUTPUT
            echo "$REVIEW" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            ERROR_MSG=$(echo $RESPONSE | jq -r '.error.message // "unknown error"')
            echo "::warning::OpenRouter API error: $ERROR_MSG"
          fi

      - name: Post review comment
        if: steps.review.outputs.review_body != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reviewBody = `${{ steps.review.outputs.review_body }}`;
            const prNumber = context.payload.pull_request?.number || context.inputs.pr_number;

            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `## OpenRouter AI Code Review 🤖\n\n${reviewBody}\n\n---\n*Reviewed by OpenRouter (openrouter/free model)*`
              });
            }
